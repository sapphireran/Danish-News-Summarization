# Mirror of finetune.py (google/mt5-large). Not loaded by the trainer.

model_name: google/mt5-large
data:
  train: datasets/train_dataset.csv
  validation: datasets/validation_dataset.csv
  test: datasets/test_dataset.csv      # tokenized, never passed to Trainer
  columns_dropped_after_tokenize: [id, body, summary]
  source_column: body
  target_column: summary
  source_max_length: 1024
  target_max_length: 128
  map_batch_size: 128

generate_config:
  min_length: 9
  max_length: 128
  length_penalty: 0.8
  no_repeat_ngram_size: 3
  num_beams: 4
  dropout_rate: 0.1

training:
  output_dir: mt5-summarize-large
  log_level: error
  num_train_epochs: 20
  learning_rate: 0.0003
  lr_scheduler_type: polynomial
  warmup_steps: 1000
  optim: adafactor
  weight_decay: 0.01
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  evaluation_strategy: epoch
  save_strategy: epoch
  predict_with_generate: true
  generation_max_length: 128
  save_steps: 100                      # ignored when save_strategy is epoch
  logging_steps: 250
  push_to_hub: false
  fp16: true
  load_best_model_at_end: true
  metric_for_best_model: rouge_1_mid_fmeasure
  save_total_limit: 1

metrics_during_train: [rouge_1_mid_fmeasure, rouge_2_mid_fmeasure, rouge_l_mid_fmeasure]
final_save_pretrained: ./large_model
tokenizer_saved_beside_model: false
