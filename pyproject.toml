[project]
name = "pakhus"
version = "0.1.0"
description = "CPU packing-house lab for the 2023 Danish news summarization course project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sapphire Ran" }]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gpu = [
  "torch",
  "transformers",
  "ctranslate2",
  "nltk",
  "pandas",
  "numpy",
  "tqdm",
  "datasets",
  "evaluate",
  "sentencepiece",
]

[project.scripts]
pakhus = "pakhus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pakhus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
